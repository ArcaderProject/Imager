name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-24.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            file \
            wget \
            curl \
            patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Set version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "const fs=require('fs');for(const f of ['src-tauri/tauri.conf.json','package.json']){const j=JSON.parse(fs.readFileSync(f,'utf8'));j.version='$VERSION';fs.writeFileSync(f,JSON.stringify(j,null,2)+'\n');}"
          echo "version set to $VERSION"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Arcader Imager ${{ github.ref_name }}
          releaseBody: Download the installer for your platform below.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Unbundle host libraries from AppImage
        if: matrix.platform == 'ubuntu-24.04'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APP=$(ls "$PWD"/src-tauri/target/release/bundle/appimage/*.AppImage | head -1)
          workdir=$(mktemp -d)
          ( cd "$workdir" && "$APP" --appimage-extract >/dev/null )
          for lib in \
            libwayland-client.so.0 libwayland-server.so.0 libwayland-egl.so.1 libwayland-cursor.so.0 \
            libudev.so.1 libsystemd.so.0 \
            libGL.so.1 libEGL.so.1 libGLdispatch.so.0 libGLX.so.0 libgbm.so.1 libdrm.so.2; do
            find "$workdir/squashfs-root" -name "$lib" -delete
          done
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O "$workdir/appimagetool"
          chmod +x "$workdir/appimagetool"
          ARCH=x86_64 "$workdir/appimagetool" --appimage-extract-and-run "$workdir/squashfs-root" "$APP"
          gh release upload "$GITHUB_REF_NAME" "$APP" --clobber
